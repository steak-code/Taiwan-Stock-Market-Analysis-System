<!DOCTYPE html>
<html>
<head>
    <title>台股分析平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-body">
                <h1 class="card-title text-center text-primary mb-4">📈 台股技術分析平台</h1>
                <form method="post">
                    <div class="mb-3">
                        <label for="symbol" class="form-label">請輸入台股代碼（如：2330）</label>
                        <input type="text" name="symbol" class="form-control" placeholder="如：2330（台積電）" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">立即分析</button>
                    </div>
                </form>
                {% if error %}
                    <div class="alert alert-danger mt-3" role="alert">
                        錯誤：{{ error }}
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
