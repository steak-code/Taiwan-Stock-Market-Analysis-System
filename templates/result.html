<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>{{ symbol }} 分析結果</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
        }
        .result-text {
            font-size: 1.3rem;
            line-height: 1.8;
            white-space: pre-line; /* 保留換行 */
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-lg">
            <div class="card-body">
                <h1 class="text-center text-info mb-4">{{ symbol }} 分析結果</h1>

                <div class="text-center my-4">
                    <img src="{{ url_for('static', filename='chart.png') }}" class="img-fluid rounded shadow" alt="預測圖表">
                </div>
                
                <!-- 加上回測圖 -->
                <div class="text-center my-4">
                    <img src="{{ url_for('static', filename='backtest.png') }}" class="img-fluid rounded shadow">
                    <p class="text-muted mt-2">📉 模型回測預測 vs 實際收盤價</p>
                </div>

                <div class="text-center">
                    <p class="result-text">{{ recent_text }}</p>
                    <p class="result-text">{{ forecast_text }}</p>
                </div>

                <div class="text-center mt-4">
                    <a href="/" class="btn btn-primary">🔙 返回首頁</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
